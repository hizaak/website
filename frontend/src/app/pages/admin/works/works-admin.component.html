<app-admin-nav></app-admin-nav>

@if (error) {
  <p class="error">{{ error | translate }}</p>
}

<table class="admin-table">
  <thead>
    <tr>
      <th>{{ 'admin.yearRange' | translate }}</th>
      <th>{{ 'admin.title' | translate }}</th>
      <th>{{ 'admin.actions' | translate }}</th>
    </tr>
  </thead>
  <tbody>
    @for (work of works; track work._id) {
      <tr>
        <td>{{ work.yearRange }}</td>
        <td>{{ work.title }}</td>
        <td>
          <button type="button" (click)="openWork(work)">{{ 'admin.edit' | translate }}</button>
          &nbsp;
          <button type="button" (click)="deleteWork(work)">{{ 'admin.delete' | translate }}</button>
        </td>
      </tr>
    }
  </tbody>
</table>

<hr>

<p><b>{{ 'admin.addWork' | translate }}</b></p>

<form (ngSubmit)="createWork()">
  <label>
    {{ 'admin.title' | translate }} :
    <input type="text" [(ngModel)]="newTitle" name="newTitle" required />
  </label>
  <button type="submit">{{ 'admin.create' | translate }}</button>
</form>
