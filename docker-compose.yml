services:
  mongodb:
    image: mongo:8
    container_name: site-perso-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-site-perso}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - mongodb_data:/data/db
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "27017:27017"
    networks:
      - site-perso-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: site-perso-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/${MONGO_DB_NAME:-site-perso}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - site-perso-network
      - npm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        ANGULAR_ENV: ${ANGULAR_ENV:-production}
    container_name: site-perso-frontend
    restart: always
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL}
    expose:
      - "80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - site-perso-network
      - npm-network
volumes:
  mongodb_data:

networks:
  site-perso-network:
    driver: bridge

  npm-network:
    external: true
