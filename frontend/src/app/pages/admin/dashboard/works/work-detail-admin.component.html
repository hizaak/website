<button type="button" (click)="backToList()">← Retour aux works</button>

<div *ngIf="error">{{ error }}</div>

<div *ngIf="work">
  <h2>Modifier le work</h2>
  <form (ngSubmit)="updateWork()">
    <label>
      Title
      <input type="text" [(ngModel)]="editTitle" name="editTitle" required />
    </label>
    <button type="submit">Enregistrer</button>
  </form>

  <h3>Photos</h3>
  <ul>
    <li *ngFor="let photo of photos">
      <span>{{ photo.photoDate }} — {{ photo.title }}</span>
      <button type="button" (click)="openPhoto(photo)">Modifier</button>
      <button type="button" (click)="deletePhoto(photo)">Supprimer</button>
    </li>
  </ul>

  <h3>Ajouter une photo</h3>
  <form (ngSubmit)="createPhoto()">
    <label>
      Title
      <input type="text" [(ngModel)]="newPhotoTitle" name="newPhotoTitle" required />
    </label>
    <label>
      Photo date (JJ/MM/AAAA)
      <input type="text" [(ngModel)]="newPhotoDate" name="newPhotoDate" placeholder="14/08/2023" required />
    </label>
    <label>
      Image file
      <input type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" (change)="onNewPhotoFileSelected($event)" />
    </label>
    <button type="submit">Ajouter</button>
  </form>
</div>

<div *ngIf="!work && !error">Chargement...</div>
