name: Deploy Website

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  deploy:
    # Only once both test jobs pass, and never for a pull request.
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e
            cd /home/amaurice/website

            # The server mirrors GitHub: anything committed or edited on it
            # directly is discarded. .env files and uploads are ignored by
            # git, so they are kept.
            git fetch origin main
            git reset --hard origin/main

            # --wait fails the deploy if a container doesn't become healthy.
            docker compose up -d --build --wait

            # Old images pile up with every build on a small disk.
            docker image prune -f
