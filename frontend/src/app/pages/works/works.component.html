<div *ngIf="error">{{ error }}</div>

<div *ngIf="works.length">
  <ng-container *ngFor="let work of works">
    {{ work.yearRange }}

    <a
      [routerLink]="[
        '/',
        languageService.currentLang,
        'works',
        work._id
      ]"
    >
      {{ work.title }}
    </a>

    <br />
  </ng-container>
</div>

<div *ngIf="!works.length && !error">
  Chargement...
</div>
