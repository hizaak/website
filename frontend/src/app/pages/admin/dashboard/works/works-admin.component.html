<div class="admin-header">
  <b>Works</b>
  <button type="button" (click)="logout()">Déconnexion</button>
</div>

<div *ngIf="error">{{ error }}</div>

<ul>
  <li *ngFor="let work of works">
    <span>{{ work.title }}</span>
    <button type="button" (click)="openWork(work)">Modifier</button>
    <button type="button" (click)="deleteWork(work)">Supprimer</button>
  </li>
</ul>

<form (ngSubmit)="createWork()">
  <label>
    Title
    <input type="text" [(ngModel)]="newTitle" name="newTitle" required />
  </label>
  <button type="submit">Créer un work</button>
</form>
