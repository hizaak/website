<p>{{ 'works.disclaimer' | translate }}</p>
<p><em>{{ 'works.quote' | translate }}</em></p>

@if (error) {
  <p>{{ error | translate }}</p>
} @else if (works) {
  @for (work of works; track work._id) {
    <span class="year-range">{{ work.yearRange }}</span>
    <a [routerLink]="['/', languageService.currentLang, 'works', work.slug]">{{ work.title }}</a>
    <br />
  }
} @else {
  <p>{{ 'common.loading' | translate }}</p>
}
