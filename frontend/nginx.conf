# Link-preview bots (WhatsApp, Discord...) don't run JavaScript, so they
# never see the tags Angular sets. Pages of the site (/, /fr/..., /en/...)
# requested by one of them are answered by the backend instead.
map "$http_user_agent@@$uri" $link_preview {
  default 0;
  "~*^.*(facebookexternalhit|facebookcatalog|whatsapp|discordbot|twitterbot|slackbot|telegrambot|linkedinbot|skypeuripreview|pinterest|redditbot|applebot|iframely|embedly).*@@/((fr|en)(/.*)?)?$" 1;
}

server {
  listen 80;
  server_name localhost;
  sendfile on;
  default_type application/octet-stream;
  root /usr/share/nginx/html;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  # Raw documents managed from the admin, served by the backend so that
  # alexandremaurice.fr/documents/mon-cv works without going through Angular.
  location /documents/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Generated from the works in the database.
  location = /sitemap.xml {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Unlike the hashed JS/CSS bundles, these keep the same URL across builds:
  # make browsers revalidate them (cheap 304 via ETag) so a deploy shows up
  # immediately instead of mixing new code with stale translations.
  location ~ ^/(i18n/.*\.json|index\.html)$ {
    add_header Cache-Control "no-cache";
  }

  location /__preview/ {
    internal;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    if ($link_preview) {
      rewrite ^ /__preview$uri last;
    }

    try_files $uri $uri/ /index.html;
  }
}
