# Included by every location of nginx.conf that serves the Angular app:
# nginx drops the server-level add_header of a location that declares its
# own, so they can't simply be set once at the server level.
#
# Images and API calls go to the API host. Angular injects component styles
# as <style> tags, hence 'unsafe-inline' for styles only. blob: is for the
# preview of a photo about to be uploaded in the admin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://api.alexandremaurice.fr data: blob:; connect-src 'self' https://api.alexandremaurice.fr; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
