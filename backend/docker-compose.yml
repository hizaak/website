# Local development only: the MongoDB that `npm run dev` connects to
# (MONGO_HOST=localhost in backend/.env). Production uses the
# docker-compose.yml at the root of the repository.
services:
  mongodb:
    # Same version as production (docker-compose.yml at the root).
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    # Reachable from this machine only, not from the local network.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongodb

volumes:
  mongodb_data:
