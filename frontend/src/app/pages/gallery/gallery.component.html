<div *ngIf="error" class="error">
  {{ error }}
</div>

<table *ngIf="photos.length > 0" class="photo-table">
  <thead>
    <tr>
      <th>YEAR</th>
      <th>TITLE</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let photo of photos">
      <td>{{ photo.date }}</td>
      <td>{{ photo.title }}</td>
    </tr>
  </tbody>
</table>

<div *ngIf="!photos.length && !error">Chargement des photos...</div>
