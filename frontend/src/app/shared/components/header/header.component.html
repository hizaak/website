<header>

  <div class="mobile-header">

    <div class="mobile-top">
      <b>alexandre maurice</b>

      <div class="mobile-language">
        <a [routerLink]="['/fr']">fr</a>
        /
        <a [routerLink]="['/en']">en</a>
      </div>
    </div>

    <div class="mobile-nav">
      <a [routerLink]="['/', languageService.currentLang, 'works']" routerLinkActive="active">{{ 'nav.works' | translate
        }}</a>
      |
      <a [routerLink]="['/', languageService.currentLang, 'contact']" routerLinkActive="active">{{ 'nav.contact' |
        translate }}</a>
      |
      <a [routerLink]="['/', languageService.currentLang, 'about']" routerLinkActive="active">{{ 'nav.about' | translate
        }}</a>
    </div>

  </div>

  <table width="100%" class="desktop-header">
    <tr>
      <td align="left">
        <b>alexandre maurice</b>
        &nbsp;

        <a [routerLink]="['/', languageService.currentLang, 'works']" routerLinkActive="active">{{ 'nav.works' |
          translate }}</a>

        |

        <a [routerLink]="['/', languageService.currentLang, 'contact']" routerLinkActive="active">{{ 'nav.contact' |
          translate }}</a>

        |

        <a [routerLink]="['/', languageService.currentLang, 'about']" routerLinkActive="active">{{ 'nav.about' |
          translate }}</a>
      </td>

      <td align="right">
        <a [routerLink]="['/fr']">fr</a>
        /
        <a [routerLink]="['/en']">en</a>
      </td>
    </tr>
  </table>

  <hr>

</header>
