<p>{{ 'works.disclaimer' | translate }}</p>
<p><em>{{ 'works.quote' | translate }}</em></p>

<div *ngIf="error">{{ error }}</div>

<div *ngIf="works.length">
  <ng-container *ngFor="let work of works">
    {{ work.yearRange }}&nbsp;

    <a
      [routerLink]="[
        '/',
        languageService.currentLang,
        'works',
        work.slug
      ]"
    >
      {{ work.title }}
    </a>

    <br />
  </ng-container>
</div>

<div *ngIf="!works.length && !error">
  Chargement...
</div>
