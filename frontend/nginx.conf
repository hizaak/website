server {
  listen 80;
  server_name localhost;
  sendfile on;
  default_type application/octet-stream;
  root /usr/share/nginx/html;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  # Raw documents managed from the admin, served by the backend so that
  # alexandremaurice.fr/documents/mon-cv works without going through Angular.
  location /documents/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Unlike the hashed JS/CSS bundles, these keep the same URL across builds:
  # make browsers revalidate them (cheap 304 via ETag) so a deploy shows up
  # immediately instead of mixing new code with stale translations.
  location ~ ^/(i18n/.*\.json|index\.html)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
