services:
  mongodb:
    image: mongo:8
    container_name: site-perso-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-site-perso}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - site-perso-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: site-perso-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    # MONGO_USER, MONGO_PASS, MONGO_DB... come from backend/.env, read by the
    # app at startup. Mounted rather than copied, so it never ends up in the
    # image.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/uploads:/app/uploads
    networks:
      - site-perso-network
      - npm-network
    healthcheck:
      test: wget -q -O /dev/null http://localhost:3000/health || exit 1
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        ANGULAR_ENV: ${ANGULAR_ENV:-production}
    container_name: site-perso-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - site-perso-network
      - npm-network

volumes:
  mongodb_data:

networks:
  site-perso-network:
    driver: bridge

  npm-network:
    external: true
