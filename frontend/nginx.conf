# Link-preview bots (WhatsApp, Discord...) don't run JavaScript, so they
# never see the tags Angular sets. Pages of the site (/, /fr/..., /en/...)
# requested by one of them are answered by the backend instead.
map "$http_user_agent@@$uri" $link_preview {
  default 0;
  "~*^.*(facebookexternalhit|facebookcatalog|whatsapp|discordbot|twitterbot|slackbot|telegrambot|linkedinbot|skypeuripreview|pinterest/0\.|pinterestbot|redditbot|applebot|iframely|embedly).*@@/((fr|en)(/.*)?)?$" 1;
}

# The address of the visitor's request without its query string.
map $request_uri $request_path {
  "~^(?<path>[^?]*)" $path;
}

server {
  listen 80;
  server_name localhost;
  sendfile on;
  default_type application/octet-stream;
  root /usr/share/nginx/html;

  gzip on;
  gzip_http_version 1.1;
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml image/x-icon;
  # Beyond 5, files barely get smaller but take much longer to compress.
  gzip_comp_level   5;

  # Any address the app doesn't know: the app's page saying so, with a 404
  # status for search engines.
  error_page 404 /index.csr.html;

  if ($link_preview) {
    rewrite ^ /__preview$uri last;
  }

  # Raw documents managed from the admin, served by the backend so that
  # alexandremaurice.fr/documents/mon-cv works without going through Angular.
  location /documents/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Generated from the works in the database.
  location = /sitemap.xml {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /__preview/ {
    internal;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Asked before serving the page of a work (see below). auth_request takes
  # no variables: the page asked for is added here, from the visitor's
  # request ($uri would be the address of this subrequest).
  location = /__exists {
    internal;
    rewrite ^ /__exists$request_path break;
    proxy_pass http://backend:3000;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  # JS and CSS bundles get a new name at every build (main-2UKO6GIS.js):
  # browsers can keep them forever. A deploy changes the HTML, which is never
  # kept without checking (below), and the HTML names the new bundles.
  location ~ "^/(chunk|main|polyfills|styles)-[A-Za-z0-9_-]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The HTML pages below keep the same address across builds: browsers must
  # check them at every visit (a cheap 304 when unchanged), so that a deploy
  # shows up at once.

  # Pages pre-rendered at build time (see app.routes.server.ts): the home
  # page (/fr, /en) and the fixed pages.
  location ~ ^/(fr|en)(/(works|about|contact|legal))?/?$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files /$1$2/index.html =404;
  }

  # A work and its photos, drawn in the browser. The backend says whether the
  # work exists (403 when it doesn't), so that an unknown one is a 404.
  location ~ ^/(fr|en)/works/[^/]+(/[0-9]+)?/?$ {
    auth_request /__exists;
    error_page 403 =404 /index.csr.html;

    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files /index.csr.html =404;
  }

  # The other addresses of the app: the admin, and those the app redirects
  # (/ to /fr or /en, /about to /fr/about or /en/about...).
  location ~ ^/((fr|en)/admin(/.*)?|works(/.*)?|about|contact|legal|admin(/.*)?)?/?$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files /index.csr.html =404;
  }

  location = /index.csr.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Other files (favicon.ico, robots.txt).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
}
