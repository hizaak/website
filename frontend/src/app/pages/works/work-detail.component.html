<div *ngIf="error">{{ error }}</div>

<ul *ngIf="photos.length > 0">
  <li *ngFor="let photo of photos">
    <a [routerLink]="['/photos', photo._id]">{{ displayLabel(photo) }}</a>
  </li>
</ul>

<div *ngIf="work && !photos.length && !error">Aucune photo.</div>
<div *ngIf="!work && !error">Chargement...</div>
